<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Πληροφορική Κουφόπουλου - Loyalty Portal</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabler-icons@latest/tabler-icons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
      color: #1f2937;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #6b21a8 0%, #7c3aed 100%);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(107, 33, 168, 0.2);
    }
    .header h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 600; }
    .header p { font-size: 1rem; opacity: 0.95; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid #e5e7eb;
    }
    .tab-btn {
      padding: 1rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      color: #6b7280;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    .tab-btn.active {
      color: #6b21a8;
      border-bottom-color: #6b21a8;
    }
    .tab-btn:hover { color: #6b21a8; }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .leaderboard {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .leaderboard-row {
      display: grid;
      grid-template-columns: 60px 1fr 100px 100px;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #f3f4f6;
      transition: background-color 0.2s ease;
    }
    .leaderboard-row:hover { background-color: #faf8ff; }
    .leaderboard-row.header {
      background: #f9fafb;
      font-weight: 600;
      color: #6b7280;
      font-size: 0.9rem;
    }
    .rank { font-weight: 700; color: #6b21a8; font-size: 1.2rem; }
    .rank.top3 { color: #7c3aed; font-size: 1.3rem; }
    .ref-code { font-family: monospace; color: #374151; font-weight: 500; }
    .points { font-weight: 600; color: #1f2937; }
    .level {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .level.bronze { background: #fcd34d; color: #78350f; }
    .level.silver { background: #e5e7eb; color: #374151; }
    .level.gold { background: #fbbf24; color: #78350f; }
    
    .lookup-form {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .lookup-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }
    .lookup-form input:focus {
      outline: none;
      border-color: #6b21a8;
      box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.1);
    }
    .lookup-form button {
      padding: 0.75rem 1.5rem;
      background: #6b21a8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lookup-form button:hover { background: #7c3aed; }
    
    .profile-card {
      background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
      border: 2px solid #e9d5ff;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
    }
    .profile-row {
      display: flex;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid #e9d5ff;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: #6b7280; font-weight: 500; }
    .profile-value { color: #1f2937; font-weight: 600; font-size: 1.1rem; }
    
    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    
    .error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
      font-size: 1.1rem;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #6b21a8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .medal { font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Αντικατάστησε αυτό με το URL του Apps Script σου (Published as web app)
    const API_URL = 'https://script.google.com/macros/s/AKfycbx7krCxIOGYbPCgMCSFn6hWFqWR3BNYlyZJaYUBG_PS1ppYj41RKCBxaYeTGaDicw46/exec';
    
    function LoyaltyPortal() {
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [leaderboard, setLeaderboard] = useState([]);
      const [clientInfo, setClientInfo] = useState(null);
      const [searchRef, setSearchRef] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      
      useEffect(() => {
        fetchLeaderboard();
      }, []);
      
      const fetchLeaderboard = async () => {
        setLoading(true);
        setError('');
        try {
          const response = await fetch(`${API_URL}?action=leaderboard`);
          const data = await response.json();
          if (data.success) {
            setLeaderboard(data.leaderboard);
          } else {
            setError(data.error || 'Σφάλμα κατά τη φόρτωση');
          }
        } catch (err) {
          setError('Δεν ήταν δυνατή η σύνδεση με τον server');
        } finally {
          setLoading(false);
        }
      };
      
      const handleSearch = async (e) => {
        e.preventDefault();
        if (!searchRef.trim()) {
          setError('Εισάγετε τον κωδικό REF');
          return;
        }
        
        setLoading(true);
        setError('');
        try {
          const response = await fetch(`${API_URL}?action=clientInfo&ref=${encodeURIComponent(searchRef.trim())}`);
          const data = await response.json();
          if (data.found) {
            setClientInfo(data.data);
          } else {
            setError('Ο κωδικός REF δεν βρέθηκε');
            setClientInfo(null);
          }
        } catch (err) {
          setError('Δεν ήταν δυνατή η σύνδεση');
        } finally {
          setLoading(false);
        }
      };
      
      const getLevelBadge = (level) => {
        const levels = { 'Bronze': 'bronze', 'Silver': 'silver', 'Gold': 'gold' };
        return levels[level] || 'bronze';
      };
      
      const getRankMedal = (rank) => {
        if (rank === 1) return '🥇';
        if (rank === 2) return '🥈';
        if (rank === 3) return '🥉';
        return rank;
      };
      
      return (
        <>
          <div className="header">
            <h1>🏆 Loyalty Program Portal</h1>
            <p>Πληροφορική Κουφόπουλου</p>
          </div>
          
          <div className="container">
            <div className="tabs">
              <button 
                className={`tab-btn ${activeTab === 'leaderboard' ? 'active' : ''}`}
                onClick={() => setActiveTab('leaderboard')}
              >
                📊 Κατάταξη (Leaderboard)
              </button>
              <button 
                className={`tab-btn ${activeTab === 'profile' ? 'active' : ''}`}
                onClick={() => setActiveTab('profile')}
              >
                👤 Ο Λογαριασμός μου
              </button>
            </div>
            
            {activeTab === 'leaderboard' && (
              <div>
                <div className="card">
                  <h2 style={{fontSize: '1.3rem', marginBottom: '1rem', color: '#1f2937'}}>
                    Top 20 Παίκτες
                  </h2>
                  {error && <div className="error">{error}</div>}
                  {loading ? (
                    <div className="loading">
                      <div className="loading-spinner"></div>
                      <p style={{marginTop: '1rem'}}>Φόρτωση...</p>
                    </div>
                  ) : (
                    <div className="leaderboard">
                      <div className="leaderboard-row header">
                        <div style={{textAlign: 'center'}}>Θέση</div>
                        <div>REF Code</div>
                        <div style={{textAlign: 'center'}}>Πόντοι</div>
                        <div style={{textAlign: 'center'}}>Επίπεδο</div>
                      </div>
                      {leaderboard.map((item, idx) => (
                        <div key={idx} className="leaderboard-row">
                          <div style={{textAlign: 'center'}}>
                            <span className={`rank ${idx < 3 ? 'top3' : ''}`}>
                              {getRankMedal(item.rank)}
                            </span>
                          </div>
                          <div className="ref-code">{item.ref}</div>
                          <div style={{textAlign: 'center'}} className="points">{item.points}</div>
                          <div style={{textAlign: 'center'}}>
                            <span className={`level ${getLevelBadge(item.level)}`}>
                              {item.level}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
            
            {activeTab === 'profile' && (
              <div>
                <div className="card">
                  <h2 style={{fontSize: '1.3rem', marginBottom: '1.5rem', color: '#1f2937'}}>
                    Αναζήτηση Προφίλ
                  </h2>
                  <form onSubmit={handleSearch} className="lookup-form">
                    <input
                      type="text"
                      placeholder="Εισάγετε τον κωδικό REF (π.χ. REF-001)"
                      value={searchRef}
                      onChange={(e) => setSearchRef(e.target.value.toUpperCase())}
                      disabled={loading}
                    />
                    <button type="submit" disabled={loading}>
                      <i className="ti ti-search"></i>
                      Αναζήτηση
                    </button>
                  </form>
                  
                  {error && <div className="error">{error}</div>}
                  
                  {loading && (
                    <div className="loading">
                      <div className="loading-spinner"></div>
                      <p style={{marginTop: '1rem'}}>Φόρτωση...</p>
                    </div>
                  )}
                  
                  {clientInfo && (
                    <div className="profile-card">
                      <div style={{textAlign: 'center', marginBottom: '1.5rem'}}>
                        <h3 style={{fontSize: '1.5rem', color: '#6b21a8', marginBottom: '0.5rem'}}>
                          {clientInfo.ref}
                        </h3>
                        <span className={`level ${getLevelBadge(clientInfo.level)}`} style={{fontSize: '1.1rem'}}>
                          {clientInfo.level}
                        </span>
                      </div>
                      
                      <div className="profile-row">
                        <span className="profile-label">Ενεργοί Πόντοι</span>
                        <span className="profile-value">{clientInfo.activePoints}</span>
                      </div>
                      
                      <div className="profile-row">
                        <span className="profile-label">Σύνολο Πόντων</span>
                        <span className="profile-value">{clientInfo.totalPoints}</span>
                      </div>
                      
                      {clientInfo.nextLevel && (
                        <>
                          <div className="profile-row">
                            <span className="profile-label">Πόντοι για {clientInfo.nextLevel}</span>
                            <span className="profile-value">{clientInfo.toNext}</span>
                          </div>
                          <div style={{paddingTop: '1rem', borderTop: '1px solid #e9d5ff', marginTop: '0.5rem'}}>
                            <span className="profile-label">Πρόοδος</span>
                            <div className="progress-bar">
                              <div 
                                className="progress-fill" 
                                style={{width: `${Math.min(100, (clientInfo.activePoints / (clientInfo.activePoints + clientInfo.toNext)) * 100)}%`}}
                              ></div>
                            </div>
                            <p style={{fontSize: '0.85rem', color: '#6b7280', marginTop: '0.5rem'}}>
                              {Math.round((clientInfo.activePoints / (clientInfo.activePoints + clientInfo.toNext)) * 100)}% κατά τρόπο για {clientInfo.nextLevel}
                            </p>
                          </div>
                        </>
                      )}
                      
                      {clientInfo.pendingCount > 0 && (
                        <div style={{marginTop: '1rem', padding: '1rem', background: '#fef3c7', borderRadius: '8px', color: '#92400e'}}>
                          ⏳ {clientInfo.pendingCount} ενέργεια(ες) σε εκκρεμότητα
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </>
      );
    }
    
    ReactDOM.render(<LoyaltyPortal />, document.getElementById('root'));
  </script>
</body>
</html>
